name: supply-chain invariants
on:
  push: { branches: ['**'], paths: ['.github/workflows/**', 'scripts/check_release_hardening.py', 'scripts/check_sigstore_itest_hardening.py', 'cedar-cabi/Dockerfile.build'] }
  pull_request: { paths: ['.github/workflows/**', 'scripts/check_release_hardening.py', 'scripts/check_sigstore_itest_hardening.py', 'cedar-cabi/Dockerfile.build'] }
permissions: {}
jobs:
  invariants:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - run: python3 scripts/check_release_hardening.py --require-real-digest
      - run: python3 scripts/check_sigstore_itest_hardening.py
